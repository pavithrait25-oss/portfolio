<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#141c33" />
      <stop offset="100%" stop-color="#1e1838" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <circle cx="200" cy="200" r="185" fill="url(#avatarBg)" stroke="url(#glowRing)" stroke-width="4" filter="url(#avatarGlow)" />
  <circle cx="200" cy="200" r="175" fill="url(#avatarBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Abstract Code Elements in background -->
  <g opacity="0.15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14">
    <text x="50" y="90">&lt;.NET&gt;</text>
    <text x="290" y="110">{ C# }</text>
    <text x="60" y="320">SQL::DB</text>
    <text x="280" y="310">&lt;/ASP&gt;</text>
  </g>

  <!-- Modern Stylized Developer Silhouette -->
  <!-- Shoulders / Jacket -->
  <path d="M 100 360 C 100 295, 140 270, 200 270 C 260 270, 300 295, 300 360 Z" fill="url(#accentGrad)" opacity="0.9" />
  
  <!-- Inner shirt collar -->
  <polygon points="175,270 200,310 225,270" fill="#ffffff" opacity="0.85" />
  <polygon points="188,270 200,320 212,270" fill="#141c33" />

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="6" fill="#e8c39e" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#f5d5b8" />

  <!-- Hair / Professional Style -->
  <path d="M 140 180 C 135 110, 265 110, 260 180 C 260 150, 245 130, 200 130 C 155 130, 140 150, 140 180 Z" fill="#1c1624" />
  <path d="M 135 180 C 135 140, 150 115, 200 115 C 250 115, 265 140, 265 180 C 260 195, 255 210, 255 210 C 250 170, 240 145, 200 145 C 160 145, 150 170, 145 210 Z" fill="#150f1d" />

  <!-- Glasses (Smart / Tech Look) -->
  <rect x="160" y="170" width="32" height="20" rx="5" fill="none" stroke="#6366f1" stroke-width="3" />
  <rect x="208" y="170" width="32" height="20" rx="5" fill="none" stroke="#6366f1" stroke-width="3" />
  <line x1="192" y1="180" x2="208" y2="180" stroke="#6366f1" stroke-width="3" />
  <line x1="148" y1="178" x2="160" y2="180" stroke="#6366f1" stroke-width="2.5" />
  <line x1="240" y1="180" x2="252" y2="178" stroke="#6366f1" stroke-width="2.5" />

  <!-- Eyes behind glasses -->
  <circle cx="176" cy="180" r="3" fill="#2c2738" />
  <circle cx="224" cy="180" r="3" fill="#2c2738" />

  <!-- Warm Smile -->
  <path d="M 188 215 Q 200 225 212 215" fill="none" stroke="#b36851" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Badge: .NET -->
  <g transform="translate(260, 240)" filter="url(#avatarGlow)">
    <rect width="90" height="34" rx="17" fill="#512bd4" stroke="#7e57c2" stroke-width="2" />
    <text x="45" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">.NET</text>
  </g>

  <!-- Floating Badge: C# -->
  <g transform="translate(50, 240)" filter="url(#avatarGlow)">
    <rect width="70" height="34" rx="17" fill="#239120" stroke="#4caf50" stroke-width="2" />
    <text x="35" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C#</text>
  </g>
</svg>
